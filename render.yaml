# Cấu hình deploy API lên Render, dạng Blueprint.
#
# Để file này trong repo thay vì bấm tay trên dashboard vì hai lý do: ai cũng
# đọc được cấu hình thật đang chạy, và dựng lại service khi lỡ xoá chỉ mất vài
# phút thay vì mò lại từng ô nhập.
#
# Cách dùng: Render Dashboard → New → Blueprint → chọn repo này.
#
# Web (apps/web) KHÔNG nằm ở đây — nó deploy lên Vercel, xem T27.

services:
  - type: web
    name: uniwork-api
    runtime: node
    plan: free

    # Singapore là vùng gần Việt Nam nhất mà gói free có. Chọn Oregon hay
    # Frankfurt thì mỗi request phải đi vòng nửa vòng trái đất, cộng thêm
    # 200–300ms cho mọi lời gọi.
    region: singapore

    branch: main

    # Phiên bản Node lấy từ file .node-version ở gốc repo, ghim vào dòng 22 LTS.
    #
    # Trước đây package.json khai `engines: ">=22"` và Render hiểu đúng nghĩa
    # đen: nó chọn Node 26 vừa phát hành. Vấn đề là @node-rs/argon2 phân phối
    # bản biên dịch sẵn theo từng phiên bản Node — gặp phiên bản chưa có bản
    # dựng thì app chết lúc khởi động, với thông báo chẳng liên quan gì tới Node.
    #
    # Ghim số cụ thể cũng có nghĩa là bản deploy hôm nay và bản deploy tháng sau
    # chạy trên cùng một runtime, không tự đổi sau lưng.

    # KHÔNG đặt rootDir thành apps/api. Đây là monorepo pnpm: lockfile và khai
    # báo workspace nằm ở gốc, cắt gốc đi thì pnpm không nối được @uniwork/shared
    # và cài đặt sẽ hỏng. Thay vào đó dùng --filter để chỉ đúng app cần chạy.
    # Dùng `npx pnpm@<phiên bản>` chứ KHÔNG dùng `corepack enable`.
    #
    # `corepack enable` tạo symlink vào /usr/bin, mà thư mục đó trên máy build
    # của Render là chỉ đọc — lỗi `EROFS: read-only file system`. npx tải pnpm
    # về thư mục cache trong $HOME nên không đụng tới vùng bị khoá.
    #
    # Phiên bản dưới đây phải khớp với trường `packageManager` ở package.json
    # gốc. Lệch phiên bản thì lockfile có thể bị diễn giải khác đi.
    # Bước `db seed` chạy mỗi lần deploy, và điều đó là an toàn:
    #
    # - Seed dùng `upsert` nên chạy lại không nhân đôi dữ liệu.
    # - Nó chỉ nạp danh mục kỹ năng ở đây. Ba tài khoản demo bị bỏ qua vì
    #   DATABASE_URL trỏ tới Neon chứ không phải localhost — chốt chặn nằm
    #   trong prisma/seed.ts, không phụ thuộc vào biến NODE_ENV.
    #
    # Nhờ vậy danh mục kỹ năng trên production luôn khớp với thứ khai trong
    # code, không cần ai nhớ chạy tay sau mỗi lần thêm kỹ năng mới.
    buildCommand: >-
      npx --yes pnpm@10.33.0 install --frozen-lockfile &&
      npx --yes pnpm@10.33.0 --filter @uniwork/api exec prisma generate &&
      npx --yes pnpm@10.33.0 --filter @uniwork/api exec prisma migrate deploy &&
      npx --yes pnpm@10.33.0 --filter @uniwork/api exec prisma db seed

    startCommand: npx --yes pnpm@10.33.0 --filter @uniwork/api start

    # Render gọi đường dẫn này để biết bản deploy mới đã sống chưa. Trỏ vào
    # /api/health được vì endpoint đó cố ý không chạm database — nếu nó truy vấn,
    # mỗi lần kiểm tra sẽ đánh thức compute của Neon và đốt hạn mức free.
    #
    # Lưu ý: cái này KHÔNG giữ cho service khỏi ngủ. Gói free ngủ khi không có
    # lưu lượng từ bên ngoài, nên vẫn cần cron-job.org ở T25.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Render tự cấp PORT và bắt buộc app phải nghe đúng cổng đó. Không hardcode.
      - key: HOST
        value: 0.0.0.0

      # sync: false nghĩa là giá trị KHÔNG nằm trong file này — phải tự nhập
      # trên dashboard. Đây là chuỗi kết nối có mật khẩu database thật; vào git
      # một lần là lộ vĩnh viễn, kể cả sau khi xoá, vì còn trong lịch sử commit.
      #
      # DATABASE_URL: chuỗi Neon CÓ `-pooler`.
      # DIRECT_URL:   chuỗi Neon KHÔNG có `-pooler`, chỉ dùng lúc migrate.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # Domain thật của web trên Vercel. Sai giá trị này thì trình duyệt chặn
      # mọi request và console báo lỗi CORS, dù API vẫn chạy hoàn toàn bình thường.
      # Nhiều origin thì ngăn cách bằng dấu phẩy, không có khoảng trắng thừa.
      - key: CORS_ORIGIN
        sync: false

      # ------------------------------------------------------------ Sprint 1

      # Chuỗi ký JWT. sync: false vì đây là bí mật thật — vào git một lần là ai
      # cũng ký được token mạo danh admin, và xoá đi cũng vô ích vì còn trong
      # lịch sử commit.
      #
      # Sinh bằng: openssl rand -base64 48
      # Mỗi môi trường một chuỗi riêng, đừng dùng lại chuỗi của máy dev.
      - key: JWT_ACCESS_SECRET
        sync: false

      # Khoá gửi email Brevo. Cũng là bí mật, nhập tay trên dashboard.
      # Nhớ xác thực địa chỉ gửi trong Brevo (Senders & IP), nếu không mọi lời
      # gọi đều bị từ chối với thông điệp khá khó hiểu.
      - key: BREVO_API_KEY
        sync: false

      # Địa chỉ đứng tên gửi. sync: false vì đây thường là email cá nhân của
      # người dựng hệ thống — không nên nằm trong file có commit.
      - key: MAIL_FROM
        sync: false

      # Hai biến dưới đây KHÔNG phải bí mật nên ghi thẳng giá trị. Chúng chỉ là
      # tinh chỉnh, và để lộ thiên thì đọc render.yaml là biết hệ thống đang
      # cấu hình thế nào — tiện hơn phải mở dashboard.
      - key: ACCESS_TTL
        value: 15m
      - key: REFRESH_TTL_DAYS
        value: '7'

      # Địa chỉ web thật, dùng ghép link trong email xác thực. Phải khớp với
      # domain Vercel, sai thì người dùng bấm link trong mail rơi vào trang lỗi.
      - key: APP_URL
        sync: false
